[pytest]
testpaths = unit integration regression
addopts = --strict-markers --strict-config -ra
markers =
    smoke: core authentication and message journey
    integration: real services with isolated container dependencies
    nightly: faults, concurrency and randomized protocol inputs
    release: packaging and desktop acceptance
    feature(id): stable feature mapping for reports
    manual: requires recorded human acceptance
junit_family = xunit2
cache_dir = ../build/test-cache/pytest
